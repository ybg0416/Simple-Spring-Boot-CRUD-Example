spring:
  application:
    name: demo
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: h2test
    password: h2test
  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect  # 엔진(방언,문법) 종류
  test-datasource:
    jdbc-url: jdbc:sqlite:src/main/resources/test.db
    driver-class-name: org.sqlite.JDBC
    username: admin
    password: admin
    hikari:
      max-lifetime: 177000
# 정상 동작하지 않아 TestDataSourceConfig에 직접 바인딩
mybatis:
  mapper-location: mapper/*.xml
  mapper-package: io.ybg.demo.mybatis.mapper
